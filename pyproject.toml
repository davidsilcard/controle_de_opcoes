[project]
name = "opcoes"
version = "0.1.0"
description = ""
authors = [
    {name = "davidsc",email = "davidsc@zanotti.com.br"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright==1.57.0",
    "yfinance>=0.2.66,<0.3.0",
    "flask>=3.1.2,<4.0.0",
    "psycopg[binary]>=3.3.3,<4.0.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "httpx>=0.28,<1.0",
    "gunicorn==23.0.0",
]


[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"


[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.23,<0.24",
    "black>=25.11.0,<26.0.0",
    "djlint>=1.36.4,<2.0.0",
]
