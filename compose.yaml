services:
  web:
    build:
      context: .
    container_name: opcoes-web
    restart: unless-stopped
    env_file:
      - ${OPCOES_APP_ENV_FILE:-.env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - ${OPCOES_WEB_BIND:-8000:8000}
    volumes:
      - ${OPCOES_DATA_DIR:-./data}:/app/data
