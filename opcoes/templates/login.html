<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Opções</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #121826;
      --muted: #5b6474;
      --accent: #1f5aff;
      --danger: #b00020;
      --border: #d9deea;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: radial-gradient(circle at top, #eef2ff, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-sizing: border-box;
      box-shadow: 0 10px 25px rgba(18, 24, 38, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
    }

    p {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }

    label {
      display: block;
      margin: 10px 0 6px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
    }

    button {
      width: 100%;
      margin-top: 16px;
      border: 0;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }

    .error {
      margin: 0 0 12px;
      color: var(--danger);
      font-size: 0.92rem;
      font-weight: 600;
    }

    .notice {
      margin-top: 12px;
      font-size: 0.82rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Acesso à plataforma</h1>
    <p>Entre com seu usuário e senha. Seus dados ficam isolados por conta.</p>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('login') }}">
      {{ csrf_input() }}
      <input type="hidden" name="next" value="{{ next_url }}" />

      <label for="username">Usuário</label>
      <input id="username" name="username" type="text" autocomplete="username" required />

      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <button type="submit">Entrar</button>
    </form>

    <p class="notice">
      Dica: o administrador cria usuários com o comando
      <code>uv run python -m opcoes.cli user create --username ...</code>.
    </p>
  </main>
</body>
</html>
