<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Opções – Ranking diário</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 sticky-top">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">Opções</a>
        <div class="navbar-nav">
          <a class="nav-link active" href="/">Ranking</a>
          <a class="nav-link" href="/performance">Desempenho</a>
          <a class="nav-link" href="/positions">Posições</a>
          <a class="nav-link" href="/covered-call">Covered Call</a>
          <a class="nav-link" href="/cash-covered-put">Cash-Covered Put</a>
          <a class="nav-link" href="/fundamentus">Fundamentus</a>
          <a class="nav-link" href="/darf">DARF</a>
          <a class="nav-link" href="/audit">Auditoria</a>
          <a class="nav-link" href="/settings">Configurações</a>
        </div>
      </div>
    </nav>

    <div class="container">
      <h1 class="h4 mb-3">Ranking diário</h1>
      <div class="mb-2">
        <div class="btn-group btn-group-sm" role="group" aria-label="Filtro tipo">
          <a class="btn {% if not option_type_filter %}btn-primary{% else %}btn-outline-primary{% endif %}" href="/?option_type=">Todas</a>
          <a class="btn {% if option_type_filter == 'CALL' %}btn-primary{% else %}btn-outline-primary{% endif %}" href="/?option_type=CALL">Ranking CALLs</a>
          <a class="btn {% if option_type_filter == 'PUT' %}btn-primary{% else %}btn-outline-primary{% endif %}" href="/?option_type=PUT">Ranking PUTs</a>
        </div>
      </div>

      <form class="row g-2 mb-3" method="get" action="/">
        <div class="col-sm-2">
          <label class="form-label">Score mínimo</label>
          <input type="number" name="min_score" class="form-control form-control-sm" value="{{ min_score }}">
        </div>
        <div class="col-sm-2">
          <label class="form-label">Limite</label>
          <input type="number" name="limit" class="form-control form-control-sm" value="{{ limit }}">
        </div>
        <div class="col-sm-3">
          <label class="form-label">Filtro de ativo/ticker (contém)</label>
          <input name="underlying" class="form-control form-control-sm" value="{{ underlying_filter }}">
        </div>
        <div class="col-sm-2">
          <label class="form-label">Tipo</label>
          <select name="option_type" class="form-select form-select-sm">
            <option value="" {% if not option_type_filter %}selected{% endif %}>Todas</option>
            <option value="CALL" {% if option_type_filter == "CALL" %}selected{% endif %}>CALLs</option>
            <option value="PUT" {% if option_type_filter == "PUT" %}selected{% endif %}>PUTs</option>
          </select>
        </div>
        <div class="col-sm-2">
          <label class="form-label">Recorrentes (dias)</label>
          <input type="number" name="recurring_days" class="form-control form-control-sm" value="{{ recurring_days }}">
        </div>
        <div class="col-sm-2">
          <label class="form-label">Limite recorrentes</label>
          <input type="number" name="recurring_limit" class="form-control form-control-sm" value="{{ recurring_limit }}">
        </div>
        <div class="col-sm-1 align-self-end">
          <button class="btn btn-primary btn-sm" type="submit">Aplicar</button>
        </div>
      </form>

      <div
        id="ranking-dashboard"
        hx-get="/partial/ranking?min_score={{ min_score|urlencode }}&limit={{ limit|urlencode }}&underlying={{ underlying_filter|urlencode }}&option_type={{ option_type_filter|urlencode }}&recurring_days={{ recurring_days|urlencode }}&recurring_limit={{ recurring_limit|urlencode }}"
        hx-trigger="load"
        hx-swap="innerHTML"
      >
        <div class="card border-0 shadow-sm">
          <div class="card-body py-4">
            <div class="d-flex align-items-center gap-3">
              <div class="spinner-border spinner-border-sm text-primary" role="status" aria-hidden="true"></div>
              <div class="text-muted small">Carregando ranking, tabelas e posições...</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
  </body>
</html>
