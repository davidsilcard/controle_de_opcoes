<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Fundamentus - Oportunidades</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <style>
      .fundamentus-table-wrap {
        max-height: 70vh;
        overflow: auto;
        border: 1px solid #dee2e6;
        background: #fff;
      }
      .fundamentus-table {
        font-size: 0.85rem;
        min-width: 1100px;
      }
      .fundamentus-table thead th {
        position: sticky;
        top: 0;
        background: #f8f9fa;
        z-index: 2;
        white-space: nowrap;
      }
      .fundamentus-table th:first-child,
      .fundamentus-table td:first-child {
        position: sticky;
        left: 0;
        background: #fff;
        z-index: 4;
      }
      .fundamentus-table thead th:first-child {
        background: #f8f9fa;
        z-index: 5;
      }
    </style>
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 sticky-top">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">Opções</a>
        <div class="navbar-nav">
          <a class="nav-link" href="/">Ranking</a>
          <a class="nav-link" href="/positions">Posições</a>
          <a class="nav-link" href="/covered-call">Covered Call</a>
          <a class="nav-link" href="/cash-covered-put">Cash-Covered Put</a>
          <a class="nav-link active" href="/fundamentus">Fundamentus</a>
          <a class="nav-link" href="/darf">DARF</a>
          <a class="nav-link" href="/audit">Auditoria</a>
          <a class="nav-link" href="/settings">Configurações</a>
        </div>
      </div>
    </nav>

    <div class="container">
      <h1 class="h4 mb-2">Fundamentus</h1>
      <div
        id="fundamentus-dashboard"
        hx-get="/fundamentus/partial/dashboard?status={{ status_filter|urlencode }}{% if snapshot_date %}&date={{ snapshot_date|urlencode }}{% endif %}{% if limit is not none %}&limit={{ limit|urlencode }}{% endif %}&window_days={{ ranking_window_days|urlencode }}"
        hx-trigger="load"
        hx-swap="innerHTML"
      >
        <div class="card border-0 shadow-sm">
          <div class="card-body py-4">
            <div class="d-flex align-items-center gap-3">
              <div class="spinner-border spinner-border-sm text-primary" role="status" aria-hidden="true"></div>
              <div class="text-muted small">Carregando filtros aplicados, ranking histórico e tabela Fundamentus...</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
    <script>
      function initFundamentusInteractive(root) {
        const scope = root || document;
        const tables = scope.querySelectorAll(".js-sort-filter-table");
        if (!tables.length) return;

        const parseNumber = (text) => {
          if (!text) return NaN;
          const cleaned = text
            .replace(/\s+/g, "")
            .replace("%", "")
            .replace(",", ".")
            .replace(/[^\d.\-]/g, "");
          if (!cleaned || cleaned === "-" || cleaned === ".") return NaN;
          const parts = cleaned.split(".");
          if (parts.length > 2) {
            return Number(parts.slice(0, -1).join("") + "." + parts[parts.length - 1]);
          }
          return Number(cleaned);
        };

        const getCellValue = (row, index, type) => {
          const cell = row.children[index];
          if (!cell) return type === "text" ? "" : NaN;
          const text = cell.textContent.trim();
          if (type === "number" || type === "percent") return parseNumber(text);
          return text.toLowerCase();
        };

        tables.forEach((table) => {
          const tbody = table.querySelector("tbody");
          if (!tbody) return;
          const sortButtons = table.querySelectorAll(".sort-btn");
          let activeSort = { index: null, direction: 1 };

          const updateIndicators = () => {
            sortButtons.forEach((btn) => {
              const indicator = btn.querySelector(".sort-indicator");
              if (!indicator) return;
              const idx = Number(btn.dataset.index);
              indicator.textContent = idx === activeSort.index ? (activeSort.direction === 1 ? " ▲" : " ▼") : "";
            });
          };

          const sortRows = (index, type, direction = null) => {
            const rows = Array.from(tbody.querySelectorAll("tr"));
            if (direction === null) {
              if (activeSort.index === index) activeSort.direction *= -1;
              else activeSort = { index, direction: 1 };
            } else {
              activeSort = { index, direction };
            }
            rows.sort((a, b) => {
              const va = getCellValue(a, index, type);
              const vb = getCellValue(b, index, type);
              const aMissing = typeof va === "number" && Number.isNaN(va);
              const bMissing = typeof vb === "number" && Number.isNaN(vb);
              if (aMissing && bMissing) return 0;
              if (aMissing) return 1;
              if (bMissing) return -1;
              if (typeof va === "number" && typeof vb === "number") return (va - vb) * activeSort.direction;
              if (va < vb) return -1 * activeSort.direction;
              if (va > vb) return 1 * activeSort.direction;
              return 0;
            });
            rows.forEach((row) => tbody.appendChild(row));
            updateIndicators();
          };

          sortButtons.forEach((btn) => {
            btn.addEventListener("click", () => {
              sortRows(Number(btn.dataset.index), btn.dataset.type || "text");
            });
          });

          updateIndicators();
        });
      }

      document.addEventListener("DOMContentLoaded", function () {
        initFundamentusInteractive(document);
      });

      document.body.addEventListener("htmx:afterSwap", function (event) {
        initFundamentusInteractive(event.target);
      });
    </script>
  </body>
</html>
